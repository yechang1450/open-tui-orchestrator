name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and personal data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest reproducible steps, including the relevant command or input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, runtime, version, and relevant configuration names. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or evidence
      description: Paste a redacted, minimal excerpt or link to a safe reproduction.
      render: text
