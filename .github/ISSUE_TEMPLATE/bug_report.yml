name: Bug report
description: Something behaved differently from what the docs promise
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: `open-tui-orchestrator --agent <host> --doctor` prints a JSON block that
        answers most setup questions (`hostError`, `carrierAvailable`, `terminal`, `spawnMode`).
        Please redact paths or tokens you do not want to share.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `open-tui-orchestrator --version`
      placeholder: open-tui-orchestrator 0.9.2 (core 1.14.2)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Node version, host agent CLI and its version, `--mode` used
      placeholder: Windows 11 26200, Node 24.21.0, codex 0.149.0, --mode headless
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and exact output
      description: The full command line plus stdout/stderr (one-line `[orchestrator] FATAL:` diagnostics included)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: Which documented behaviour did not hold (link the doc or README section if you can)
    validations:
      required: true
  - type: textarea
    id: runstate
    attributes:
      label: Run state (for run-level issues)
      description: Run id plus the relevant part of `<workspace>\temp\orchestrator\runs\<id>\summary.json` (`results[].status/reason`, `taskResults`)
      render: json
    validations:
      required: false
