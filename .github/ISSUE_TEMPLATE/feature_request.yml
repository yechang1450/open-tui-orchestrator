name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and describe the user problem.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What change would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: textarea
    id: context
    attributes:
      label: Additional context
